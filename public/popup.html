<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mix It!</title>
    <style>
        :root{
            --bg-1: #f7fbff;
            --bg-2: #ffffff;
            --accent: #5b6cff;
            --muted: #6b7280;
            --card-shadow: 0 6px 18px rgba(91,108,255,0.12);
            --radius: 12px;
            --gap: 10px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            font-size: 13px;
        }
        html,body{ height:100%; margin:0; background: linear-gradient(180deg,var(--bg-1),var(--bg-2)); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; color:#0f172a; }
        .wrap{ width:320px; padding:14px; box-sizing:border-box; }
        .card{ background:white; border-radius:var(--radius); box-shadow:var(--card-shadow); padding:14px; text-align:center; }
        .brand{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:6px; }
        h1{ margin:0; font-size:16px; letter-spacing:0.2px; }
        p.desc{ margin:8px 0 14px; color:var(--muted); font-size:12px; }
        .controls{ display:flex; gap:var(--gap); align-items:center; justify-content:center; margin-bottom:12px; }
        button.primary{ background: linear-gradient(180deg,var(--accent), #7b8bff); color:white; border:0; padding:10px 14px; border-radius:8px; cursor:pointer; font-weight:600; box-shadow: 0 6px 14px rgba(91,108,255,0.12); transition: transform .08s ease, box-shadow .12s ease; }
        button.primary:active{ transform: translateY(1px); }
        button.primary:disabled{ opacity:0.6; cursor:not-allowed; transform:none; box-shadow:none; }
        hr.sep{ border:0; height:1px; background:linear-gradient(90deg, transparent, #eef2ff, transparent); margin:10px 0; border-radius:1px; }
        .footer{ display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
        a.link{ color:var(--accent); text-decoration:none; font-weight:600; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card" role="dialog" aria-label="Mix It popup">
            <div class="brand">
                <div>
                    <h1>Mix It!</h1>
                    <div style="font-size:11px;color:var(--muted);margin-top:4px">Youtube Mixer</div>
                </div>
            </div>

            <p class="desc">버튼을 누르면 믹스 페이지로 이동합니다.</p>

            <div class="controls">
                <button id="mixIt" class="primary" title="Create mix">Mix It</button>
            </div>

            <hr class="sep" />

            <div class="footer">
                <div style="display:flex;gap:8px;align-items:center">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden>
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="#c7cbe6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="3" stroke="#c7cbe6" stroke-width="1.2"/>
                    </svg>
                    <span>© VBKOROA</span>
                </div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
